<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C4E82"/>
      <stop offset="1" stop-color="#16283F"/>
    </linearGradient>
    <linearGradient id="phoneShine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7ECF3"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- phone body -->
  <rect x="382" y="212" width="260" height="500" rx="46" fill="url(#phoneShine)" stroke="#0F1E33" stroke-width="10"/>
  <rect x="406" y="264" width="212" height="360" rx="10" fill="#16283F"/>
  <circle cx="512" cy="656" r="20" fill="#16283F"/>

  <!-- screen highlight: simple bar-chart glyph to nod at inventory/sales -->
  <rect x="432" y="470" width="28" height="110" rx="6" fill="#3FBFAE"/>
  <rect x="484" y="420" width="28" height="160" rx="6" fill="#8FD9CE"/>
  <rect x="536" y="500" width="28" height="80" rx="6" fill="#3FBFAE"/>
  <rect x="588" y="450" width="28" height="130" rx="6" fill="#8FD9CE"/>

  <!-- price / sale tag accent -->
  <g transform="translate(700,590) rotate(18)">
    <path d="M0 40 L92 40 L150 98 L92 156 L0 156 Z" fill="#3FBFAE" stroke="#16283F" stroke-width="10"/>
    <circle cx="34" cy="98" r="16" fill="#16283F"/>
  </g>
</svg>
